spring.application.name=2doai

# Datasource — never hardcode the JDBC URL here.
# Local dev: derived from compose.yaml by spring-boot-docker-compose.
# Tests: provided by Testcontainers @ServiceConnection.
# Production: SPRING_DATASOURCE_URL/USERNAME/PASSWORD from Fly secrets (Neon).
spring.datasource.hikari.maximum-pool-size=5

# Pool idleness is load-bearing NON-default config — like the fly.toml scheduler settings,
# do not "simplify" it back to Hikari defaults. Neon bills metered compute and only
# autosuspends after ~5 min with no activity, while the Fly machine is always-on. Hikari's
# defaults hold the database awake 24/7 two different ways:
#   - minimum-idle defaults to maximum-pool-size  → 5 connections pinned open forever
#   - keepalive-time defaults to 120s in HikariCP 6 → a real ping every 2 min, which resets
#     Neon's 5-min idle timer before it can ever fire
# Net effect of the defaults: ~183 CU-h/month against a 100 CU-h free-tier budget (measured
# the hard way — see context/foundation/lessons.md). Draining the pool instead costs a cold
# start (~1s Neon resume) on the first request after idle: the right trade at MVP scale.
# Guarded by DataSourcePoolPropertiesTest.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=0

# JPA / Hibernate — Flyway owns the schema; Hibernate only validates mappings
# against it (a free drift guard). Never update/create.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations live in classpath:db/migration.
spring.flyway.enabled=true

# Session cookie (S-01) — the decided auth model: server-side HttpSession, in-memory on the single
# Fly machine (not JWT). Cookie attributes: HttpOnly + SameSite=Strict everywhere; ~30-min idle
# timeout matching the in-memory model (a redeploy logs everyone out anyway — accepted at 1–10 users).
# Secure is env-driven: OFF in dev (Vite serves http://localhost, and a Secure cookie is silently
# dropped over http, making login appear not to persist), ON in prod via the Fly env
# SERVER_SERVLET_SESSION_COOKIE_SECURE=true.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

# Honour X-Forwarded-* from Fly's TLS terminator. Without this the origin request looks like plain
# HTTP, so request.isSecure() is false and CookieCsrfTokenRepository ships XSRF-TOKEN without the
# Secure flag — the session cookie gets it from the env var above, the CSRF cookie would not.
server.forward-headers-strategy=framework

# JSON property naming (S-01, Zalando #118) — snake_case across the whole API surface, set once
# globally rather than annotating each DTO. So Category serializes name_pl / display_order, not
# camelCase. Single-word properties (id, email, password, items) are unaffected.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Actuator — health endpoint probed by Fly's health check
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Liveness/readiness split (load-bearing): Fly's probe moves to /actuator/health/liveness
# so a sleeping/transient Neon never flaps the always-on machine and kills the FR-011
# scheduler. DB health lives in readiness only.
# proposalScheduler is the scheduler's own pulse (S-05) — the failure it catches is the tick
# thread dying while the web server keeps answering, which is otherwise invisible because the
# symptom is the app doing nothing. It reads a field, never the database; putting anything
# DB-touching in this group would undo the split above. Guarded by HealthProbeApiTest.
management.endpoint.health.group.liveness.include=livenessState,proposalScheduler
management.endpoint.health.group.readiness.include=readinessState,db

# LLM gateway — OpenRouter (OpenAI-compatible) reached via Spring AI's OpenAI client, behind
# the LlmClient port. api-key is a secret: Fly secret OPENROUTER_API_KEY in prod, local env
# injection in dev — never commit a real key. The empty default puts Spring AI's OpenAI client
# in no-auth mode, so boot and the hermetic test suite stay green; the live round-trip is gated
# on the env var being present.
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
# Request (read) timeout for a generation call. A separate connect timeout isn't exposed by the
# OpenAI client; the old 5s connect budget is dropped (minor).
spring.ai.openai.timeout=60s
# Retries AFTER the first attempt (1 = 2 total). The OpenAI client retries 429/5xx and fails
# fast on other 4xx. S-09 auto-tag can drop this to 0 for its <500ms feedback budget.
spring.ai.openai.max-retries=1
# No embeddings yet (F-02 defers RAG) — don't auto-create an embedding model on the empty key.
spring.ai.openai.embedding.enabled=false

# Model slugs split by use-case (Haiku = auto-tag/S-09, Sonnet = proposals/S-04), read by
# callers and passed per request. OpenRouter slugs use dots, not first-party dashes.
llm.model.haiku=anthropic/claude-haiku-4.5
llm.model.sonnet=anthropic/claude-sonnet-4.6

# Natural rhythm (S-05, FR-011) — the envelope the scheduler draws each next fire time inside:
# a day uniformly 2-7 days out, then a moment uniformly inside 9:00-21:00 of the user's day
# (Europe/Warsaw; ProposalRhythm.USER_ZONE is the seam). Configuration rather than constants
# because whether this reads as "a friend" or "a cron" is judged over days of real use — tuning
# it must not be a code change. Guarded by RhythmPropertiesTest.
proposal.rhythm.min-days=2
proposal.rhythm.max-days=7
proposal.rhythm.window-start-hour=9
proposal.rhythm.window-end-hour=21

# Email delivery (S-05, FR-018) — how the rhythm reaches a user who is not looking at the app.
# Resend over plain SMTP, so the provider is a credentials choice and not a dependency. password is
# a secret: Fly secret RESEND_API_KEY in prod, local env injection in dev — never commit a real key.
# The empty default is the same load-bearing pattern the OpenRouter key uses above: boot and the
# hermetic test suite stay green with no key present, and the one real send is a gated live test.
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.starttls.enable=true
# Load-bearing, not tuning: JavaMail defaults every one of these to infinite, and the send is a
# blocking call on the single @Scheduled thread. One unresponsive connection would stall the tick
# forever — which the proposalScheduler liveness probe above would then read as a dead scheduler and
# restart the machine over, redoing the Sonnet call the stalled fire already paid for.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# The two things about a message that are the app's business rather than the transport's (guarded by
# MailboxPropertiesTest). from must sit on a domain verified with the provider or every message is
# dropped without a bounce; base-url is where the link in the email points — the Vite dev server
# locally, https://2doai.app in prod via the Fly env APP_BASE_URL.
app.mail.from=2do AI <propozycje@2doai.app>
app.mail.base-url=${APP_BASE_URL:http://localhost:5173}

# AI-memory render cap — only the last N episodes are injected into a prompt/export block,
# bounding prompt-token cost regardless of episodic-log size (the log is append-only, never
# pruned). S-04 can override per call via render(memory, maxEpisodes).
ai.memory.render.max-episodes=20
