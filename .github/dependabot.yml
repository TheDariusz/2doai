version: 2

# Trivy and Dependabot are complementary, not redundant: Trivy detects and fails
# the merge, Dependabot opens the PR that fixes. The `github-actions` entry is
# also what stops SHA-pinning from trading a tag-hijack risk for a staleness
# risk — pinned SHAs never receive security fixes on their own, but Dependabot
# understands them and bumps the pin along with its version comment.
#
# Every ecosystem is grouped into a single PR, which is what makes `weekly`
# viable: 3 VERSION-update PRs a week rather than one per package.
#
# THAT IS NOT A TOTAL. Grouping governs version updates only. Security updates
# come from Dependabot alerts, and GitHub is explicit that they are separate:
# "Dependabot will not group dependencies from different package ecosystems
# together, and it will not group security updates with version updates", and
# "there is no interaction between the settings specified in the dependabot.yml
# file and Dependabot security alerts". They arrive one per advisory, whenever
# an advisory lands, and nothing here throttles them — PRs #10/#11/#12 were
# exactly that: three separate ungrouped npm PRs.
#
# Editing this file also triggers an immediate off-schedule run, so a change
# here produces PRs now, not next week.
updates:
  # Looks inside .github/workflows/, AND a root action.yml if one ever exists,
  # so "/" is correct. ("/.github" is not documented as valid.)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TS 7 (the Go compiler) type-checks and builds this app fine, but
      # typescript-eslint hard-`throw`s on import against it — it is a deliberate
      # version guard, not a stale peer range, and no release or canary lifts it
      # yet. Upstream is tracking support for TS >= 7.1
      # (typescript-eslint/typescript-eslint#10940), so ignore only 7.0.x rather
      # than blocking the major outright: when 7.1 lands Dependabot proposes it
      # again and the gate tells us whether lint survived. No line to remember to
      # delete.
      - dependency-name: typescript
        versions: ["7.0.x"]

  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
    ignore:
      # loki4j 2.1.x is built against Logback 1.6; Boot 4.1.2 manages Logback 1.5, which is the
      # 2.0.x line (see loki4j.version in pom.xml). Left alone, the grouped weekly PR proposes 2.1 as
      # a minor, which the auto-merge workflow merges on green. Drop this when Boot moves to Logback 1.6.
      - dependency-name: com.github.loki4j:loki-logback-appender
        versions: ["[2.1,)"]
