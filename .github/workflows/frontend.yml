name: Frontend (quality + deploy to Cloudflare Pages)

# NO trigger-level `paths:` filter — see the comment in backend.yml. Path
# filtering lives inside the jobs so the required check always reports.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    # Distinct from backend.yml's `quality` job — see the comment there on why
    # two identically-named check contexts break a required-status-check rule.
    name: frontend quality
    runs-on: ubuntu-latest
    # Own group so a PR run never queues behind (or cancels) a master deploy.
    # Cancel on PRs, never on master — see the comment in backend.yml for the
    # sequence where a later unrelated push drops an earlier push's deploy.
    concurrency:
      group: frontend-quality-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `changes` diffs against the base commit

      - name: Detect frontend changes
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (new branch, force-push, all-zeroes SHA) -> assume touched.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then range="$BASE...HEAD"; else range="$BASE..HEAD"; fi
          # ASSIGN FIRST, then match — see the comment in backend.yml. Piping into
          # the `if` condition would let a `git diff` fatal read as "nothing
          # changed", skipping lint/test/build and the Trivy gate on a green check.
          # `.trivyignore` and `trivy-report.yaml` are gate inputs — see the note
          # in backend.yml on why a suppression-only PR must not skip the scan.
          changed=$(git diff --name-only "$range")
          if grep -qE '^(frontend/|\.trivyignore$|\.github/(workflows/frontend\.yml|trivy-report\.yaml)$)' <<<"$changed"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint
      - if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm test
      - if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

      # No `npm install` needed — Trivy reads package-lock.json directly (~1.5 s).
      # The dev-dep split is deliberate: the report shows all 272 packages so
      # build-time supply-chain risk stays visible, but the gate below scans prod
      # deps only, because a devDependency CVE should not block a merge.
      - name: Trivy — dependency report (informational, incl. dev deps)
        if: steps.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          # Carries `pkg.include-dev-deps` — see the file for why this cannot be
          # an env var. The gate step below deliberately omits it.
          trivy-config: .github/trivy-report.yaml
          trivyignores: .trivyignore
          format: table
          output: trivy-frontend.txt
          exit-code: '0'

      - name: Publish frontend dependency report
        if: steps.changes.outputs.frontend == 'true'
        run: |
          {
            echo '## Frontend dependencies (Trivy, all severities, incl. dev deps)'
            echo '```'
            cat trivy-frontend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend dependency report
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-frontend
          path: trivy-frontend.txt

      - name: Trivy — dependency gate (prod deps, fixable HIGH/CRITICAL)
        if: steps.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          trivyignores: .trivyignore
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  deploy:
    needs: quality
    if: github.event_name == 'push' && needs.quality.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `quality` ran in a separate job with its own workspace, so dist/ has to be
      # rebuilt here for wrangler to upload. ~30 s; cheaper in YAML than an artifact
      # round-trip, and it re-runs the typecheck on exactly what ships.
      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=2doai-web
