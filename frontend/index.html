<!doctype html>
<html lang="en">
  <head>
    <!-- First paint: the stylesheet is a <link> and the app a deferred module, so `data-theme` has to
         be set here or a dark user flashes light on every load. Same rule as `src/theme.ts`, which
         owns every change after this. -->
    <script>
      try {
        var t = localStorage.getItem('2doai.theme')
      } catch (e) {}
      document.documentElement.dataset.theme =
        t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable from "Add to Home Screen": iOS reads the manifest's `display` but only takes its
         home-screen icon from the apple-touch-icon, never from the favicon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="2do AI" />
    <meta name="theme-color" content="#ffffff" />
    <!-- The heading face. Body copy stays on the system stack, so a blocked or slow font delays
         nothing a user reads — only how the headings are set. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&display=swap"
    />
    <meta
      name="description"
      content="2do AI keeps everyday tasks, long-term goals and someday dreams in one place, reminds you of plans you have set aside, and suggests a first step."
    />
    <title>2do AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
