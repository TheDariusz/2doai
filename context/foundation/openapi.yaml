openapi: 3.1.0

# API-first contract (Zalando #100/#101): the users + sessions + categories resources (S-01),
# the goals resource (S-02, widened to current tasks by S-07), the proposals resource (S-04a) and
# the operational /ping probe. Every path the server publishes is here — an endpoint the deployment
# depends on but the spec omits is the drift this file exists to prevent.
# Authoritative over any older path prose in plan.md.
#
# Design decisions worth calling out:
#   - Verb-free, resource-oriented URLs (#141/#138): register = POST /users, login = POST
#     /sessions, logout = DELETE /sessions/current, current user = GET /users/me, delete
#     account = DELETE /users/me. No /login, /logout, /register action paths.
#   - No URL version segment (#115/#113): the server base path is /api (kept only because
#     Cloudflare Pattern B reverse-proxies /api/* to Fly — a justified deviation from #135);
#     future breaking changes would use media-type versioning, not /v2.
#   - snake_case properties (#118); collections wrapped in a top-level object (#110); errors as
#     Problem JSON / RFC 9457 (#176); 422 for validation, 409 for conflict (#220).
info:
  title: 2do AI — API
  description: >
    Identity and session management for 2do AI (S-01): register an account, log in / out, read
    the current user, and permanently delete the account and all its data (FR-019). Also exposes
    the read-only list of the 11 fixed life domains (categories) the app navigation is built from,
    and the goals resource (S-02/S-07) — current tasks, long-term goals and someday dreams,
    per-user and full CRUD. The proposals resource (S-04) is the proactive half: it picks the one
    neglected entry worth coming back to and phrases it. Session model is a server-side HttpSession cookie (not JWT); mutations are
    CSRF-protected via a double-submit XSRF-TOKEN cookie echoed as the X-XSRF-TOKEN header.
  # #116 — MAJOR.MINOR.PATCH over the *contract*, not the app. 1.0.0 was S-01 (users, sessions,
  # categories); +goals (S-02) → 1.1.0, +proposals (S-04a) → 1.2.0, +current tasks (S-07) → 1.3.0,
  # +the phrased, stored, answerable proposal (S-04b) → 1.4.0. Each was a compatible addition, so
  # each was a MINOR bump; a breaking change would need media-type versioning (#114), never a URL
  # segment.
  version: 1.4.0
  contact:
    name: 2do AI
    email: thedariusz@gmail.com
  x-api-id: 3b6f0e9a-1c2d-4e7f-9a10-2f5c8d4b7e01           # #215 globally-unique API id
  x-audience: component-internal                            # #219 consumed only by the 2do AI SPA

servers:
  # #135 says avoid an /api base path; kept here because Cloudflare (Pattern B) reverse-proxies
  # /api/* to the Fly backend, so /api is the routing seam, not a decorative prefix. Paths below
  # are therefore version-free and resource-only.
  - url: /api
    description: Same-origin (Cloudflare → Fly). Local dev proxies /api → localhost:8080 via Vite.

tags:
  - name: users
    description: The user identity resource.
  - name: sessions
    description: Authentication sessions (login / logout).
  - name: categories
    description: The 11 fixed life-domain reference records.
  - name: goals
    description: Current tasks, long-term goals and someday dreams — all three layers.
  - name: proposals
    description: The proactive engine's pick of one neglected entry.
  - name: operations
    description: Operational endpoints — not part of the domain model.

paths:
  /users:
    post:
      tags: [users]
      summary: Register a new user
      description: >
        Creates a user from an email + password. Does not log the user in (session creation is the
        sole responsibility of POST /sessions). The email is normalized (trimmed + lowercased) and
        must be unique; a taken email returns 409.
      operationId: createUser
      security: []                                          # public (#104 exception: registration)
      parameters:
        - $ref: '#/components/parameters/XsrfToken'         # public, but still a mutation — CSRF applies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User created.
          headers:
            Location:
              description: Canonical location of the created user (readable once authenticated).
              schema:
                type: string
                format: uri-reference
                example: /api/users/me
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'          # missing / invalid CSRF token
        '409':
          $ref: '#/components/responses/Conflict'           # email already in use
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me:
    get:
      tags: [users]
      summary: Get the current user
      description: >
        Returns the authenticated user. The SPA calls this on load to bootstrap auth state; the
        response (or its 401) also carries the XSRF-TOKEN cookie primed by the server so the first
        mutation can echo it.
      operationId: getCurrentUser
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [users]
      summary: Delete the current user and all their data (FR-019)
      description: >
        Permanently removes the authenticated user and every per-user record they own (their
        ai_memory profile facts + episodes), then invalidates the session. Irreversible. Requires
        re-entering the password as a re-authentication step. NOTE: a request body on DELETE has no
        defined HTTP semantics (RFC 9110); it works same-origin behind Cloudflare, and is used here
        so the re-auth password travels with the delete rather than in a separate step.
      operationId: deleteCurrentUser
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletion'
      responses:
        '204':
          description: Account and all data deleted; session invalidated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'       # not logged in / session expired — never a wrong password
        '403':
          # 3.1 lets a Reference Object override the target's description, so the shared Forbidden
          # response stays the single definition of the media type and schema.
          $ref: '#/components/responses/Forbidden'
          description: >
            Two distinct causes, told apart by the Problem `type` (never by parsing `detail`):
            `urn:2doai:problem:re-auth-failed` means the confirmation password is wrong — the session
            is intact and the user may retry. Any other `type`, **including its absence** (the server
            omits the member entirely on this path), is a missing or invalid CSRF token, which only a
            page reload re-primes, so a client must not offer a bare retry as the remedy for it.
            A wrong password is deliberately NOT a 401: on an authenticated call every SPA reads 401
            as "session expired" and would log the user out over a typo.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions:
    post:
      tags: [sessions]
      summary: Log in (create a session)
      description: >
        Authenticates an email + password and establishes a server-side session, returned as an
        HttpOnly session cookie (Set-Cookie). The body echoes the authenticated user for the SPA's
        convenience. Bad credentials return a generic 401 with no indication of whether the email
        exists (no user enumeration).
      operationId: createSession
      security: []                                          # public (login is the entry point)
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Session created.
          headers:
            Set-Cookie:
              description: The HttpOnly; SameSite=Strict session cookie (Secure in prod).
              schema:
                type: string
            Location:
              schema:
                type: string
                format: uri-reference
                example: /api/sessions/current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'       # generic bad-credentials
        '403':
          $ref: '#/components/responses/Forbidden'          # missing / invalid CSRF token
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable' # login is the only operation that loads a user

  /sessions/current:
    delete:
      tags: [sessions]
      summary: Log out (invalidate the current session)
      operationId: deleteCurrentSession
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Session invalidated and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories:
    get:
      tags: [categories]
      summary: List the life-domain categories
      description: >
        Returns the 11 fixed life domains (FR-007) in canonical display order. This collection is
        intentionally NOT paginated (#159/#226): it is bounded reference data of exactly 11 rows.
      operationId: getCategories
      responses:
        '200':
          description: The full set of categories.
          headers:
            Cache-Control:
              description: >
                `max-age=3600, private` (#227). The eleven rows are owned by a Flyway seed and cannot
                change under a running process, so an hour of browser cache costs nothing; `private`
                because the collection is served behind the session cookie and must not be held by a
                shared cache. Every other endpoint keeps Spring Security's `no-store` default.
              schema:
                type: string
                example: max-age=3600, private
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /goals:
    get:
      tags: [goals]
      summary: List the caller's entries across all three layers
      description: >
        Every task, goal and dream owned by the authenticated user, newest first — all three layers
        in one collection, discriminated by `layer`. Deliberately unfiltered and unpaginated, and
        S-08 kept it that way rather than adding the filter contract this line used to promise: the
        SPA holds both filters in the query string and applies them in the browser, which at
        single-user scale costs one unfiltered round-trip and no wire surface.


        Unpaginated is a deviation from #159, and unlike `/categories` — bounded at eleven seeded
        rows forever — this collection only grows. So the exception carries a trigger rather than a
        defence: **add cursor pagination (`cursor` + `limit`, #160) once a caller's list passes ~500
        entries or the response passes ~250 kB**, whichever comes first. Both are compatible
        additions (#107) — new optional query parameters and a `cursors` object beside `items` — so
        holding off costs nothing later, and the wrapper `items` already sits in is what keeps it
        that way.
      operationId: getGoals
      responses:
        '200':
          description: The caller's tasks, goals and dreams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [goals]
      summary: Create a task, a goal or a dream
      description: >
        Creates an entry in any of the three layers, subject to one rule over the two time fields: a
        GOAL requires a `horizon`, a DREAM and a TASK must omit it, and only a TASK may carry a
        `due_date` (which is itself optional). Breaking that rule returns 422 (the body parsed, its
        content is invalid), whereas an unrecognized enum literal in any field — `layer`, `horizon`
        or `category_code` — never deserializes and returns 400.


        **Not idempotent, deliberately** (#229/#231 considered and deferred): two identical POSTs
        create two entries. The duplicate a user could actually cause — a double-tapped submit — is
        already prevented in the SPA, which disables the button while the request is in flight, and
        nothing in the client retries a request on its own. An `Idempotency-Key` would therefore buy
        nothing today and cost a table of seen keys plus its eviction. Revisit when a client gains
        automatic retries, or offline queueing — at that point the key belongs in the header, not in
        a de-duplication guess over `content`.
      operationId: createGoal
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreation'
      responses:
        '201':
          description: The created entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /goals/{id}:
    put:
      tags: [goals]
      summary: Replace an entry
      description: >
        Full replace (#137 PUT semantics), so one operation covers every write: editing the text,
        re-categorizing, converting between any two layers, and completing or un-completing via
        `completed`. A conversion has to move the time fields in the same request — a goal becoming
        a task drops its `horizon` and may pick up a `due_date`; sending both is a 422.


        A goal owned by another account and a goal that never existed return the **same** 404 with
        the same `detail`: distinguishing them would let a caller probe other accounts' identifiers.
        Only `instance` differs, and it merely echoes the id the caller already supplied.


        Completion is recorded once: re-sending `completed: true` on an already-completed entry
        leaves `completed_at` at its original moment, so editing a finished entry never moves its
        completion date. Un-completing and completing again is the only way to set a new one.
      operationId: replaceGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdate'
      responses:
        '200':
          description: The updated entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [goals]
      summary: Delete an entry
      description: >
        Removes the entry permanently — a hard delete, not a withdrawal: the row is gone and the id
        stops resolving, so repeating the call returns 404. This is not the "nigdy" state S-04
        introduces (which keeps the entry and marks it) nor FR-019 account erasure (which removes
        every entry at once).


        A goal owned by another account and a goal that never existed return the **same** 404, and
        the foreign row is left untouched — telling them apart would let a caller probe other
        accounts' identifiers.
      operationId: deleteGoal
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: The entry was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /proposals:
    post:
      tags: [proposals]
      summary: Ask the engine for one neglected entry
      description: >
        Runs the deterministic selection engine (S-04a, FR-012/FR-015 — the "give me something now"
        trigger) over the
        caller's entries and returns the single one worth coming back to. An entry counts as
        neglected once it has been idle for its layer's patience — 7 days for a TASK, 14 for a GOAL,
        30 for a DREAM — or, for a TASK alone, once its `due_date` has passed. A missed term ranks
        ahead of any amount of silence, so an overdue task is proposed before a merely idle entry.
        Within a tier the engine prefers the life domain the user has been silent in longest, so
        proposals rotate between domains instead of flooding whichever one is most neglected — and a
        domain counts as active if anything in it was touched recently, **completed entries
        included**. Entries with no `category_code` share a single bucket rather than one each.


        POST rather than GET, with no request body: asking is an action, and it becomes an unsafe one
        as soon as state sits behind it — FR-013's four responses and FR-018's at-most-one-pending
        rule both do. The answer must never be cached.


        Nothing neglected yet is **204**, not 404 — the resource answered, the caller simply has
        nothing gathering dust.


        The picked entry is then phrased by an LLM into prose (S-04b) and the result is
        **stored**, so this call creates a resource rather than computing one. At most one proposal
        may be unanswered at a time (FR-018), which makes a repeated POST idempotent in practice: it
        returns the pending proposal unchanged — same `id`, same `message` — with no second model
        call, until that proposal is answered. If the model is unreachable the endpoint still answers
        200, with the message written from a template and `source: TEMPLATE`.
      operationId: createProposal
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: The entry the engine picked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '204':
          description: Nothing has been neglected long enough to propose.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ping:
    get:
      tags: [operations]
      summary: Smoke-check the request path
      description: >
        Operational, not a business resource: it proves the Pattern B chain (Cloudflare Pages
        Function → Fly backend) end to end, which `/actuator/health` cannot — that path is not
        proxied under `/api/*`. Public, and touches no database, so a sleeping Neon never answers
        it and never wakes for it.


        It is also the one public path that answers 200 to a GET, which makes it how the SPA and the
        test suite prime the `XSRF-TOKEN` cookie before a first mutation. `GET /users/me` primes the
        same cookie on its 401 and would serve as well; this is the cheaper of the two.


        A verb in an otherwise verb-free API (#141), kept deliberately: an operational probe is not a
        domain concept, and `/pings` would invent a collection that does not exist. Specified rather
        than left out — an endpoint the deployment and the test harness both depend on is part of
        the contract (#101).
      operationId: getPing
      security: []                                          # public (#104 exception: reachability probe)
      responses:
        '200':
          description: The backend is reachable through the full proxy chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionCookie:
      # Server-side HttpSession, referenced by an opaque cookie (Spring's JSESSIONID). Not a bearer
      # token — validation is in-memory on the single Fly machine and never queries the database.
      type: apiKey
      in: cookie
      name: JSESSIONID

  # Every operation is authenticated by default; the public entry points override with
  # `security: []` (register, login, ping).
  # (applied at the operation level above via `security: []`; global default below)
  #
  # #105/#225 (permissions and their naming) are deliberately not implemented, and this is the note
  # that says so rather than leaving the omission to look like an oversight. Scopes exist to let one
  # API grant different subsets of itself to different callers; here there is exactly one caller (the
  # SPA, `x-audience: component-internal`) and every operation acts on the caller's own data. The
  # authorization rule is ownership, enforced per query in the service layer — a scope model on top
  # would be a second vocabulary describing the same single permission. Revisit when a second client
  # appears, or when any operation reads data the caller does not own (an admin or export path).

  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: >
        CSRF token echoed from the XSRF-TOKEN cookie on every mutating request (double-submit).
        (#132 would spell this X-Xsrf-Token; the functional header Spring reads is X-XSRF-TOKEN.)
      schema:
        type: string

    GoalId:
      name: id
      in: path
      required: true
      description: The goal's identifier (UUID v7 surrogate PK).
      schema:
        type: string
        format: uuid

  schemas:
    User:
      type: object
      description: A user identity. Minimal by design (YAGNI) — display name / flags come later.
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid                                      # UUID v7 surrogate PK (intentional, #144)
          readOnly: true
        email:
          type: string
          format: email
          example: alice@example.com

    UserRegistration:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8                                      # baseline hardening; mirrors @Size(min=8)
          maxLength: 72
          x-max-utf8-bytes: 72
          description: At most 72 UTF-8 bytes (the BCrypt input limit).
          writeOnly: true

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 72
          x-max-utf8-bytes: 72
          description: At most 72 UTF-8 bytes (the BCrypt input limit).
          writeOnly: true

    AccountDeletion:
      type: object
      description: Re-authentication for the irreversible FR-019 account deletion.
      required: [password]
      properties:
        password:
          type: string
          format: password
          maxLength: 72
          x-max-utf8-bytes: 72
          description: At most 72 UTF-8 bytes (the BCrypt input limit).
          writeOnly: true

    CategoryCollection:
      # #110 — object at the top level, never a bare array, so fields can be added without breaking.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    Category:
      type: object
      required: [code, name, display_order]
      properties:
        code:
          type: string
          description: Language-neutral identity, mirrors the LifeDomain enum.
          # #112 open-ended enum so a 12th domain never breaks clients.
          x-extensible-enum:                                # in display_order, mirroring V2__seed_categories.sql
            - HEALTH
            - FINANCE
            - CAREER
            - EDUCATION
            - RELATIONSHIPS
            - HOME
            - LEISURE
            - ADMIN
            - SAFETY
            - TRANSPORT
            - INNER_GROWTH
          example: HEALTH
        name:
          type: string
          description: >
            The label to show this caller, in the language the server picked — Polish today, because
            it is the only one seeded (MVP is Polish-only). Named for its role rather than its
            language (#244): when English lands, an `Accept-Language` header changes what this field
            contains and no client changes at all, whereas a `name_pl`/`name_en` pair would make
            every client choose, and renaming `name_pl` then would be the breaking change (#106)
            this spelling avoids while there is exactly one client to move. Storage keeps its
            language in the column name (`category.name_pl`) — it holds one language, this field
            answers a question.
          example: Zdrowie
        display_order:
          type: integer
          format: int32                                     # #171 integers declare int32/int64
          minimum: 1
          maximum: 11
          example: 1

    GoalCollection:
      # #110 — object at the top level, never a bare array.
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Goal'

    GoalLayer:
      # THE ANCHOR for these literals. Named once and $ref'd by Goal / GoalCreation / GoalUpdate —
      # repeating the list in each would recreate, inside the anchor itself, the drift this file
      # exists to prevent. Held against the backend enum by GoalApiTest and against the SPA's goal
      # type by the same test (lessons.md: one check that spans the boundary).
      type: string
      description: >
        Which layer the entry belongs to — a long-term goal (FR-004), a someday dream (FR-005) or a
        current task (FR-003). It also decides which time fields are allowed: see `GoalHorizon` and
        `GoalDueDate`.
      # #112 open-ended enum: a fourth layer must not break existing clients.
      x-extensible-enum:
        - GOAL
        - DREAM
        - TASK
      example: GOAL

    GoalHorizon:
      # Nullable at the schema level rather than at each use site: a DREAM has no horizon, so every
      # place this appears legitimately admits null.
      type: [string, 'null']
      description: >
        How far out a long-term goal reaches (FR-004). Required for layer GOAL, and must be null for
        layers DREAM and TASK — half of the cross-field rule the API enforces with 422.
      x-extensible-enum:
        - THIS_YEAR
        - FEW_MONTHS
      example: THIS_YEAR

    GoalDueDate:
      # The mirror of GoalHorizon, and the other half of the same cross-field rule. A date rather
      # than a timestamp: a term is a day the user picks off a calendar, not a moment in a timezone,
      # and `<input type="date">` sends exactly this.
      type: [string, 'null']
      format: date
      description: >
        A current task's optional term (FR-003). Allowed only for layer TASK, and must be null for
        layers GOAL and DREAM. Null means the task simply has no deadline, which is the common case.
      example: '2026-09-01'

    GoalContent:
      type: string
      minLength: 1
      maxLength: 500                                      # mirrors Goal.MAX_CONTENT_LENGTH and the column width
      description: What the user wants to achieve, in their own words.
      example: Przebiec półmaraton

    GoalCategoryCode:
      # Deliberately NOT re-listing the 11 codes: Category.code above is their anchor, and a second
      # copy here would be one more unguarded duplicate (see the open item in lessons.md).
      type: [string, 'null']
      description: >
        Optional life domain, referencing `Category.code`. Null means uncategorized; S-09 adds the
        AI auto-tag but a user may always leave an entry without a category.
      example: HEALTH

    Goal:
      type: object
      description: >
        A current task (FR-003), a long-term goal (FR-004) or a someday dream (FR-005). One
        representation for all three layers: `layer` discriminates, `horizon` is present only for
        GOAL, and `due_date` only for TASK.
      required: [id, content, layer, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid                                    # UUID v7 surrogate PK (intentional, #144)
          readOnly: true
        content:
          $ref: '#/components/schemas/GoalContent'
        layer:
          $ref: '#/components/schemas/GoalLayer'
        horizon:
          $ref: '#/components/schemas/GoalHorizon'
        due_date:
          $ref: '#/components/schemas/GoalDueDate'
        category_code:
          $ref: '#/components/schemas/GoalCategoryCode'
        completed_at:
          # The completion state IS this timestamp — null means active. A timestamp rather than a
          # boolean because S-03's memory enrichment needs to know when, not merely whether.
          type: [string, 'null']
          format: date-time
          readOnly: true
        remind_after:
          # S-04b: the day a quieted entry comes back, inclusive. Written by three of the four
          # proposal answers (POST /proposals/{id}/answer), never by a goal write — which is why it
          # appears here and not in GoalUpdate.
          type: [string, 'null']
          format: date
          readOnly: true
        withdrawn_at:
          # S-04b "nigdy": the entry is out of the running until it is restored, never deleted. Same
          # shape as completed_at, and published because the SPA's withdrawn filter is what makes the
          # answer reversible.
          type: [string, 'null']
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    GoalCreation:
      type: object
      required: [content, layer]
      properties:
        content:
          $ref: '#/components/schemas/GoalContent'
        layer:
          $ref: '#/components/schemas/GoalLayer'
        horizon:
          $ref: '#/components/schemas/GoalHorizon'
        due_date:
          $ref: '#/components/schemas/GoalDueDate'
        category_code:
          $ref: '#/components/schemas/GoalCategoryCode'

    GoalUpdate:
      type: object
      description: >
        Full-replace payload, so the same request shape edits, converts, completes and un-completes.
        `completed` is not optional-by-omission in either direction: the server answers 400 to a body
        that leaves it out (Jackson rejects a null for a primitive), so a client that means "still
        active" sends `false` rather than nothing.
      required: [content, layer]
      properties:
        content:
          $ref: '#/components/schemas/GoalContent'
        layer:
          $ref: '#/components/schemas/GoalLayer'
        horizon:
          $ref: '#/components/schemas/GoalHorizon'
        due_date:
          $ref: '#/components/schemas/GoalDueDate'
        category_code:
          $ref: '#/components/schemas/GoalCategoryCode'
        completed:
          type: boolean
          default: false
          description: True marks the entry done (setting `completed_at`); false reopens it.

    Proposal:
      type: object
      description: >
        The engine's answer: the entry it picked, the reason it won, and the prose S-04b phrases
        around both. `neglected_days` is that reason made explicit and `message` quotes it, which is
        why the number is frozen on the proposal when it is created rather than recomputed per read.


        A proposal is a stored resource, not a per-request calculation. At most one may be unanswered
        at a time (FR-018, enforced by a partial unique index), so **a repeated POST returns the same
        proposal** — same `id`, same `message`, and no second model call — until it is answered.


        `answer`, `answered_at` and `first_step` are null on a fresh proposal and filled by the
        answer endpoint, which returns this same schema: one shape for the client to render whether
        it just asked for a proposal or just answered one.
      required: [id, entry, neglected_days, message, source]
      properties:
        id:
          type: string
          format: uuid                                    # UUID v7 surrogate PK (intentional, #144)
          readOnly: true
        entry:
          $ref: '#/components/schemas/Goal'
        neglected_days:
          type: integer
          format: int64                                     # #171 integers declare int32/int64
          minimum: 0
          description: >
            Whole days since the user last interacted with the entry. Zero is a legitimate answer:
            a task edited today whose `due_date` has already passed is neglected on its term, not on
            its silence.
          example: 47
        message:
          type: string
          description: >
            The proposal in prose, 2–3 sentences, citing the entry's own words and the time that has
            passed. Written in the language the server picked — Polish today, because it is the only
            locale the app has (the same framing as `Category.name`). Written once when the proposal
            is created and stored, so a re-read never silently says something different from what the
            user already read.
          readOnly: true
          example: W styczniu wpisałeś „zrobić prawo jazdy" — minęło 8 miesięcy. Wracamy do tego?
        source:
          $ref: '#/components/schemas/ProposalSource'
        answer:
          $ref: '#/components/schemas/ProposalAnswer'
        answered_at:
          type: [string, 'null']
          format: date-time
          description: When the user answered. Null means the proposal is still the pending one.
          readOnly: true
        first_step:
          # FR-014's bullets, stored on the proposal (jsonb) rather than regenerated: a reload must
          # show the plan the user already read, not a fresh and quietly different one.
          type: [array, 'null']
          items:
            type: string
          minItems: 3
          maxItems: 5
          description: >
            3–5 concrete opening steps, present only after a `STARTING` answer. An empty array means
            the answer landed but the model did not — the proposal is still answered.
          readOnly: true

    ProposalSource:
      type: string
      description: >
        Which arm phrased `message`. Published rather than kept server-side so a demo (and a bug
        report) can tell a real model proposal from the template the app falls back to when the
        provider is unreachable — the endpoint answers 200 either way.
      # #112 open-ended enum: a third phrasing arm must not break existing clients.
      x-extensible-enum:
        - LLM
        - TEMPLATE
      example: LLM

    ProposalAnswer:
      # THE ANCHOR for these literals — $ref'd by Proposal and by the answer request, never repeated.
      type: [string, 'null']
      description: >
        The four responses of FR-013, each of which changes what the engine proposes next. `STARTING`
        also asks for `first_step`. `NOT_NOW` and `REMIND_LATER` are one mechanism with different
        defaults — both quiet the entry until a date — and `NEVER` withdraws it until the user
        restores it. Null on a proposal nobody has answered yet.
      # #112 open-ended enum: a fifth response must not break existing clients.
      x-extensible-enum:
        - STARTING
        - NOT_NOW
        - REMIND_LATER
        - NEVER
      example: STARTING

    Ping:
      type: object
      description: >
        A reachability acknowledgement. Deliberately fixed and detail-free — a probe that is public
        must not report a version, a host or a build, all of which help an attacker more than they
        help the operator.
      required: [status]
      properties:
        status:
          # A constant, not an enumeration: there is no second value and none is coming, so #240's
          # UPPER_SNAKE_CASE (which governs enum *domains*) does not apply. A failing chain is a
          # non-200, never a different literal here.
          const: ok

    Problem:
      # RFC 9457 Problem Details (#176). Emitted as application/problem+json for every error.
      type: object
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  responses:
    BadRequest:
      description: Malformed request syntax.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but the request is not allowed (e.g. missing CSRF token).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >
        No such resource for this caller. Returned identically whether the resource does not exist or
        belongs to another account — telling the two apart would turn the API into an existence
        oracle for other users' identifiers, so the `detail` is fixed and carries no id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicting state (e.g. the email is already registered).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The request was well-formed but failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: >
        An unhandled server fault. Reachable on every operation — `ApiExceptionHandler` and
        `ProblemErrorController` render it as Problem JSON like any other error, so a client parses
        it the same way rather than falling into an unrecognized-status branch.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: >
        Authentication could not be completed for an infrastructure reason (a connection-pool
        timeout, a database cold start that overran) — deliberately NOT reported as 401, which would
        tell every user their password is wrong during an outage. Retry; the credentials were never
        judged.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

# Authenticated by default (#104); register + login opt out with `security: []`.
security:
  - sessionCookie: []
